name: Verify Personality Level repair
on:
  push:
    branches: ['work/personality-level-font-20261104']
    paths: ['.github/workflows/prepare-level-assets.yml', 'tools/card-templates/v3/patch_personality_levels.py']
permissions:
  contents: write
concurrency:
  group: verify-personality-level-font
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            tools/deployment
      - uses: actions/cache/restore@v4
        id: source-cache
        with:
          path: .git/objects
          key: personality-level-source-20261105
          restore-keys: source-git-v1-Linux-
      - name: Materialize source
        run: |
          if [ -z '${{ steps.source-cache.outputs.cache-matched-key }}' ]; then
            git -c protocol.version=2 fetch --refetch --no-filter --no-tags --no-recurse-submodules --no-auto-maintenance --depth=1 origin "$(git rev-parse HEAD)"
          fi
          git -c checkout.workers=4 sparse-checkout disable
          git diff --exit-code HEAD
      - name: Install native renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends inkscape python3-pil python3-numpy python3-lxml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repair and verify source, then confirm an unchanged second pass
        env:
          OMP_NUM_THREADS: 1
        run: |
          /usr/bin/python3 tools/card-templates/v3/patch_personality_levels.py
          git add public/assets/cards public/cards/catalog.js public/ultra-rare-profiles.js docs/card-type-audit-2026-10-25.json tools/card-templates/v3 tools/card-corrections
          /usr/bin/python3 tools/card-templates/v3/patch_personality_levels.py
          git diff --exit-code
          if ! git diff --cached --quiet; then
            git -c user.name='Card production' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Match Personality Level numerals and verify all printed numbers'
            git push origin HEAD:work/personality-level-font-20261104
          fi
      - run: npm test
