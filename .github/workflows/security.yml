name: Security checks

on:
  push:
    branches: [main, 'security-*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

jobs:
  checks:
    name: Tests and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out build instructions without large source files
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            tools/deployment
      - name: Identify the source asset revision
        id: source-assets
        shell: bash
        run: |
          revision="$(git rev-parse HEAD:public/assets/cards HEAD:tools/card-templates HEAD:tools/card-corrections | sha256sum | cut -d ' ' -f 1)"
          echo "key=source-git-v1-${RUNNER_OS}-$revision" >> "$GITHUB_OUTPUT"
      - name: Restore downloaded source objects
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/objects
          key: ${{ steps.source-assets.outputs.key }}
          restore-keys: source-git-v1-${{ runner.os }}-
      - name: Materialize the complete source for all checks
        shell: bash
        run: |
          git sparse-checkout disable
          git diff --exit-code HEAD
          git count-objects -vH
          df -h .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run check
      - name: Prepare the small production package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node tools/deployment/package-release.mjs "$RUNNER_TEMP/cloudflare-production"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: cloudflare-production
          path: ${{ runner.temp }}/cloudflare-production
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: Save source objects for subsequent builds
        if: github.event_name == 'push' && steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/objects
          key: ${{ steps.source-assets.outputs.key }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/tools/
            !/public/assets/
          sparse-checkout-cone-mode: false
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
