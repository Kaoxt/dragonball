name: Security checks

on:
  push:
    branches: [main, 'security-*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

jobs:
  checks:
    name: Tests and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run check
      - name: Prepare the small production package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node tools/deployment/package-release.mjs "$RUNNER_TEMP/cloudflare-production"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: cloudflare-production
          path: ${{ runner.temp }}/cloudflare-production
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/tools/
            !/public/assets/
          sparse-checkout-cone-mode: false
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
