name: Finish Cell Games banner logos
on:
  push:
    branches: [cell-games-banner-logo]
    paths:
      - .github/workflows/cell-games-banner-logo.yml
      - tools/card-templates/v3/patch_cell_games_banner_logo.py
      - tests/**
permissions:
  contents: read
concurrency:
  group: cell-games-banner-logo
  cancel-in-progress: true
jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            tools/deployment
      - uses: actions/cache/restore@v4
        id: source-cache
        with:
          path: .git/objects
          key: banner-logo-source-${{ github.sha }}
          restore-keys: source-git-v1-Linux-
      - name: Fetch source snapshot
        if: steps.source-cache.outputs.cache-matched-key == ''
        run: git -c protocol.version=2 fetch --refetch --no-filter --no-tags --no-recurse-submodules --no-auto-maintenance --depth=1 origin "$(git rev-parse HEAD)"
      - name: Materialize source
        run: git -c checkout.workers=4 sparse-checkout disable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install native renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends inkscape python3-pil python3-numpy python3-lxml
      - name: Update and verify all 200 images
        env:
          CELL_GAMES_LOGO_BASELINE: ${{ runner.temp }}/cell-games-banner-baseline
        run: |
          /usr/bin/python3 tools/card-templates/v3/patch_cell_games_banner_logo.py
          /usr/bin/python3 tools/card-templates/v3/patch_cell_games_banner_logo.py
      - name: Validate application and historical revisions
        run: |
          npm ci
          npm test
          npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cell-games-banner-logo-release
          path: tools/card-corrections/v3-cell-games-banner-logo/release.json
          retention-days: 7
      - name: Publish verified images to the working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/cards/cell-games-*.webp public/assets/cards/downloads/cell-games-*.webp public/cards/catalog.js tools/card-templates/v3/cell-games-001-050 tools/card-templates/v3/cell-games-051-100 tools/card-corrections/v3-cell-games-banner-logo
          git commit -m "Apply approved banner logo to all 100 Cell Games cards"
          git -c pack.window=0 push origin HEAD:refs/heads/cell-games-banner-logo
