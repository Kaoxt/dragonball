name: Verify Personality stage repair
on:
  push:
    branches: [personality-stages-zero-bottom]
    paths:
      - .github/workflows/personality-stages.yml
      - tools/card-templates/v3/patch_personality_stages.py
      - tools/card-templates/v3/scripts/personality_stages.py
      - tools/card-templates/v3/build_batch_101_150.py
      - tests/**
      - package.json
permissions:
  contents: read
concurrency:
  group: personality-stages-zero-bottom
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            tools/deployment
      - uses: actions/cache/restore@v4
        id: source-cache
        with:
          path: .git/objects
          key: personality-stage-source-${{ github.sha }}
          restore-keys: source-git-v1-Linux-
      - name: Fetch source snapshot
        if: steps.source-cache.outputs.cache-matched-key == ''
        run: git -c protocol.version=2 fetch --refetch --no-filter --no-tags --no-recurse-submodules --no-auto-maintenance --depth=1 origin "$(git rev-parse HEAD)"
      - name: Materialize source
        run: git -c checkout.workers=4 sparse-checkout disable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install native renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends inkscape python3-pil python3-numpy python3-lxml
      - name: Repair and verify the existing image pairs
        env:
          PERSONALITY_STAGE_BASELINE: ${{ runner.temp }}/personality-stage-baseline
        run: |
          /usr/bin/python3 tools/card-templates/v3/patch_personality_stages.py
          /usr/bin/python3 tools/card-templates/v3/patch_personality_stages.py
      - name: Validate application and historical audits
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personality-stage-release
          path: tools/card-corrections/v3-personality-stages/release.json
          retention-days: 7
      - name: Save verified output to the repair branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/cards public/cards/catalog.js public/personality-power.js tools/card-templates/v3/android-101-125-promos tools/card-templates/v3/frieza-061-100 tools/card-templates/v3/frieza-101-125-promos tools/card-corrections/v3-android-101-125-promos/cards.json tools/card-corrections/v3-personality-stages/release.json
          git diff --cached --quiet || git commit -m "Correct 22 Personality stage columns and Android 18 scan value"
          git -c pack.window=0 push origin HEAD:refs/heads/personality-stages-zero-bottom
