name: Lockfile refresh

on:
  push:
    branches: [security-hardening-2026-10]
    paths:
      - .github/workflows/lock-refresh.yml

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit fix --package-lock-only
      - name: Emit refreshed lockfile for review
        run: |
          echo LOCKFILE_BASE64_BEGIN
          base64 -w0 package-lock.json
          echo
          echo LOCKFILE_BASE64_END
