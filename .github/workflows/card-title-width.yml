name: Verify card title width revision
on:
  push:
    branches: [card-title-width-roundness]
    paths:
      - .github/workflows/card-title-width.yml
      - tools/card-templates/v3/patch_title_width.py
      - tools/card-templates/v3/scripts/title_width_v3.py
      - tests/**
permissions:
  contents: read
concurrency:
  group: card-title-width-roundness
  cancel-in-progress: true
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            tools/deployment
      - uses: actions/cache/restore@v4
        id: source-cache
        with:
          path: .git/objects
          key: title-source-${{ github.sha }}
          restore-keys: source-git-v1-Linux-
      - name: Fetch source snapshot
        if: steps.source-cache.outputs.cache-matched-key == ''
        run: git -c protocol.version=2 fetch --refetch --no-filter --no-tags --no-recurse-submodules --no-auto-maintenance --depth=1 origin "$(git rev-parse HEAD)"
      - name: Materialize source
        run: git -c checkout.workers=4 sparse-checkout disable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install renderer and verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends inkscape python3-pil python3-numpy python3-lxml python3-fonttools
      - name: Download the six already verified sets
        uses: actions/download-artifact@v4
        with:
          pattern: title-batch-*
          merge-multiple: true
          path: ${{ runner.temp }}/title-batch
          github-token: ${{ github.token }}
          run-id: 42242673363
      - name: Assemble verified output and check repeatability
        run: |
          /usr/bin/python3 tools/card-templates/v3/patch_title_width.py "$RUNNER_TEMP/title-batch" --assemble --apply
          /usr/bin/python3 tools/card-templates/v3/patch_title_width.py "$RUNNER_TEMP/title-batch" --apply
          find "$RUNNER_TEMP/title-batch" -name '*.webp' -delete
      - name: Validate application
        run: |
          npm ci
          npm test
          npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: title-width-release
          path: tools/card-corrections/v3-title-footer-width/release.json
          retention-days: 7
      - name: Publish verified source to the working branch in bounded pushes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          /usr/bin/python3 - <<'PYTHON'
          import json,subprocess
          from pathlib import Path
          release=json.loads(Path('tools/card-corrections/v3-title-footer-width/release.json').read_text())
          paths=[e['path'] for c in release['cards'] for e in c['exports']]
          chunks=[];chunk=[];size=0
          for p in paths:
              length=Path(p).stat().st_size
              if chunk and size+length>512*1024*1024:chunks.append(chunk);chunk=[];size=0
              chunk.append(p);size+=length
          if chunk:chunks.append(chunk)
          for i,chunk in enumerate(chunks,1):
              subprocess.run(['git','add','--',*chunk],check=True)
              subprocess.run(['git','commit','-m',f'Publish verified title image batch {i}/{len(chunks)}'],check=True)
              subprocess.run(['git','-c','pack.window=0','push','origin','HEAD:refs/heads/card-title-width-roundness'],check=True)
          PYTHON
          git add public/cards/catalog.js public/ultra-rare-profiles.js tools/card-templates/v3 tools/card-corrections/v3-title-footer-width
          git commit -m "Record complete title revision, native sources and current image references"
          git push origin HEAD:refs/heads/card-title-width-roundness
